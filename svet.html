<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <!-- Aplikace na ploše (PWA): manifest, ikona a celá obrazovka bez lišty prohlížeče -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/ikony/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/ikony/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <!-- black-translucent: obsah sahá až pod hodiny a baterii (okraj řeší env(safe-area-inset-top) v CSS) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Svět · Dashboard</title>
  <link rel="stylesheet" href="css/style.css?v=19">
</head>
<body data-zalozka="svet">
  <header class="hlavicka">
    <div class="hlavicka-obsah">
      <a class="logo" href="index.html">Dashboard</a>
      <nav class="navigace" id="navigace" aria-label="Záložky"></nav>
    </div>
  </header>

  <main>
    <div class="hlavicka-stranky hlavicka-s-obnovou">
      <h1>Svět</h1>
      <!-- Tlačítko „Aktualizovat vše“ (logika v js/obnova.js) -->
      <div id="obnovit-vse"></div>
    </div>

    <!-- Přepínač částí (řídí nastavPrepinac ze spolecne.js), část je v adrese: svet.html#zpravy -->
    <div class="prepinac" role="tablist" aria-label="Části">
      <button type="button" role="tab" data-cast="pocasi">Počasí</button>
      <button type="button" role="tab" data-cast="zpravy">Zprávy</button>
      <button type="button" role="tab" data-cast="finance">Finance</button>
    </div>

    <section class="cast" id="cast-pocasi" role="tabpanel">
      <!-- Čas poslední aktualizace a kolečko vloží js/obnova.js -->
      <div class="obnova cast-obnova" id="obnova-pocasi"></div>
      <!-- Počasí vloží js/pocasi.js (živě z Open-Meteo) -->
      <div id="pocasi">
        <p class="nacitani">Načítá se…</p>
      </div>
      <p class="podnadpis">Zdroj: Open-Meteo.com</p>
    </section>

    <section class="cast" id="cast-zpravy" role="tabpanel" hidden>
      <div class="obnova cast-obnova" id="obnova-zpravy"></div>
      <!-- Tlačítka zdrojů a zprávy vloží js/zpravy.js -->
      <div class="filtry" id="filtry"></div>
      <ul class="seznam" id="zpravy">
        <li class="nacitani">Zprávy se načítají…</li>
      </ul>
      <p class="podnadpis">Zdroje: ČT24, iRozhlas, BBC (RSS)</p>
    </section>

    <section class="cast" id="cast-finance" role="tabpanel" hidden>
      <div class="obnova cast-obnova" id="obnova-akcie"></div>
      <!-- Akcie a portfolio vloží js/akcie.js z dat v ~/Dashboard-data/akcie/ -->
      <div id="akcie">
        <p class="nacitani">Načítá se…</p>
      </div>
      <p class="podnadpis">Ceny: Yahoo Finance · kurzy: ČNB</p>
    </section>
  </main>

  <footer class="paticka"><button type="button" class="odkaz-tlacitko" id="odhlasit">Odhlásit</button></footer>

  <script src="js/zalozky.js?v=19"></script>
  <script src="js/spolecne.js?v=19"></script>
  <script src="js/obnova.js?v=19"></script>
  <script src="js/moduly/pocasi.js?v=19"></script>
  <script src="js/moduly/zpravy.js?v=19"></script>
  <script src="js/moduly/akcie.js?v=19"></script>
  <script src="js/pocasi.js?v=19"></script>
  <script src="js/zpravy.js?v=19"></script>
  <script src="js/akcie.js?v=19"></script>
  <script>
    nastavPrepinac();
    document.getElementById("obnovit-vse").append(vytvorHlavniObnovu());
  </script>
</body>
</html>
