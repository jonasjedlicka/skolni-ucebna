<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <!-- Aplikace na ploše (PWA): manifest, ikona a celá obrazovka bez lišty prohlížeče -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/ikony/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/ikony/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <!-- black-translucent: obsah sahá až pod hodiny a baterii (okraj řeší env(safe-area-inset-top) v CSS) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Předmět · Dashboard</title>
  <link rel="stylesheet" href="css/style.css?v=18">
</head>
<!-- Detail předmětu patří pod záložku Škola, proto data-zalozka="skola" -->
<body data-zalozka="skola">
  <header class="hlavicka">
    <div class="hlavicka-obsah">
      <a class="logo" href="index.html">Dashboard</a>
      <nav class="navigace" id="navigace" aria-label="Záložky"></nav>
    </div>
  </header>

  <!-- Tahle jedna stránka slouží pro všechny předměty.
       Který předmět ukázat, pozná js/predmet.js z adresy,
       např. predmet.html?id=matematika
       Celý obsah <main> vytvoří JavaScript. -->
  <main>
    <a class="zpet" href="skola.html#predmety" id="zpet">Škola</a>
    <div id="predmet">
      <p class="nacitani">Předmět se načítá…</p>
    </div>
  </main>

  <footer class="paticka">Data: Edookit · <button type="button" class="odkaz-tlacitko" id="odhlasit">Odhlásit</button></footer>

  <script src="js/zalozky.js?v=18"></script>
  <script src="js/spolecne.js?v=18"></script>
  <script src="js/moduly/skola.js?v=18"></script>
  <script src="js/predmet.js?v=18"></script>
</body>
</html>
