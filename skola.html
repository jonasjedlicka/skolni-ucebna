<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <!-- Aplikace na ploše (PWA): manifest, ikona a celá obrazovka bez lišty prohlížeče -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/ikony/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/ikony/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <!-- black-translucent: obsah sahá až pod hodiny a baterii (okraj řeší env(safe-area-inset-top) v CSS) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Škola · Dashboard</title>
  <link rel="stylesheet" href="css/style.css?v=21">
</head>
<body data-zalozka="skola">
  <header class="hlavicka">
    <div class="hlavicka-obsah">
      <a class="logo" href="index.html">Dashboard</a>
      <nav class="navigace" id="navigace" aria-label="Záložky"></nav>
    </div>
  </header>

  <main>
    <div class="hlavicka-stranky">
      <h1>Škola</h1>
      <p class="podnadpis" data-stav="skola" data-max-hodin="48"></p>
    </div>

    <!-- Přepínač částí. Vybraná část je v adrese za #, např. skola.html#testy,
         takže odkaz vede rovnou na ni. Přepínání řídí js/skola.js. -->
    <div class="prepinac" role="tablist" aria-label="Části školy">
      <button type="button" role="tab" data-cast="rozvrh">Rozvrh</button>
      <button type="button" role="tab" data-cast="testy">Testy</button>
      <button type="button" role="tab" data-cast="znamky">Známky</button>
      <button type="button" role="tab" data-cast="predmety">Předměty</button>
      <button type="button" role="tab" data-cast="ukoly">Úkoly</button>
      <button type="button" role="tab" data-cast="doucovani">Doučování</button>
    </div>

    <section class="cast" id="cast-rozvrh" role="tabpanel">
      <!-- Sem vykreslí js/rozvrh.js týdenní rozvrh -->
      <div id="rozvrh" class="rozvrh-mrizka">
        <p class="nacitani">Rozvrh se načítá…</p>
      </div>
    </section>

    <section class="cast" id="cast-testy" role="tabpanel" hidden>
      <!-- Sem vloží js/testy.js nadcházející testy -->
      <ul class="seznam" id="testy">
        <li class="nacitani">Testy se načítají…</li>
      </ul>
    </section>

    <section class="cast" id="cast-znamky" role="tabpanel" hidden>
      <!-- Známky vloží js/znamky.js: z Edookitu (stahují se každých 6 h) + vlastní zápisy.
           Čas aktualizace a kolečko vloží js/obnova.js -->
      <div class="obnova cast-obnova" id="obnova-znamky"></div>
      <div id="znamky">
        <p class="nacitani">Načítá se…</p>
      </div>
    </section>

    <section class="cast" id="cast-predmety" role="tabpanel" hidden>
      <!-- Dlaždice předmětů vloží js/skola.js; materiály jsou v detailu předmětu -->
      <div class="mrizka" id="predmety">
        <p class="nacitani">Předměty se načítají…</p>
      </div>
    </section>

    <section class="cast" id="cast-ukoly" role="tabpanel" hidden>
      <!-- Jen školní úkoly; všechny jsou v Plánu → Úkoly. Vkládá js/ukoly.js -->
      <div id="ukoly" data-druh="skola">
        <p class="nacitani">Načítá se…</p>
      </div>
    </section>

    <section class="cast" id="cast-doucovani" role="tabpanel" hidden>
      <!-- Lekce doučování vloží js/doucovani.js, ukládají se na server v Macu (js/zapisy.js) -->
      <div id="doucovani">
        <p class="nacitani">Načítá se…</p>
      </div>
    </section>

  </main>

  <footer class="paticka">Data: Edookit · <button type="button" class="odkaz-tlacitko" id="odhlasit">Odhlásit</button></footer>

  <script src="js/zalozky.js?v=21"></script>
  <script src="js/spolecne.js?v=21"></script>
  <script src="js/zapisy.js?v=21"></script>
  <script src="js/obnova.js?v=21"></script>
  <script src="js/moduly/skola.js?v=21"></script>
  <script src="js/rozvrh.js?v=21"></script>
  <script src="js/testy.js?v=21"></script>
  <script src="js/moduly/ukoly.js?v=21"></script>
  <script src="js/moduly/doucovani.js?v=21"></script>
  <script src="js/moduly/znamky.js?v=21"></script>
  <script src="js/skola.js?v=21"></script>
  <script src="js/ukoly.js?v=21"></script>
  <script src="js/doucovani.js?v=21"></script>
  <script src="js/znamky.js?v=21"></script>
</body>
</html>
