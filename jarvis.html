<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Jarvis · Dashboard</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body data-zalozka="jarvis">
  <header class="hlavicka">
    <div class="hlavicka-obsah">
      <a class="logo" href="index.html">Dashboard</a>
      <nav class="navigace" id="navigace" aria-label="Záložky"></nav>
    </div>
  </header>

  <main class="jarvis">
    <div class="hlavicka-stranky jarvis-hlavicka">
      <div>
        <h1>Jarvis</h1>
        <p class="podnadpis">Osobní asistent nad tvými daty</p>
      </div>
      <button type="button" class="filtr" id="nova-konverzace">Nová konverzace</button>
    </div>

    <!-- Bubliny konverzace vloží js/jarvis.js. aria-live = čtečka obrazovky
         přečte novou odpověď, jakmile přijde. -->
    <div class="konverzace" id="konverzace" aria-live="polite"></div>
    <p class="slaby premysleni" id="premysleni" hidden>Jarvis přemýšlí…</p>
    <p class="chyba-text" id="upozorneni" role="status"></p>

    <form class="dotaz sklo" id="dotaz">
      <textarea id="dotaz-text" rows="1" placeholder="Zeptej se Jarvise…" aria-label="Zpráva pro Jarvise"></textarea>
      <button type="submit" id="dotaz-odeslat">Poslat</button>
    </form>
  </main>

  <script src="js/zalozky.js?v=3"></script>
  <script src="js/spolecne.js?v=3"></script>
  <!-- Moduly kvůli nástrojům: Jarvis čte stejná data jako dashboard -->
  <script src="js/moduly/skola.js?v=3"></script>
  <script src="js/moduly/kalendar.js?v=3"></script>
  <script src="js/moduly/akcie.js?v=3"></script>
  <script src="js/moduly/zpravy.js?v=3"></script>
  <script src="js/jarvis-nastaveni.js?v=3"></script>
  <script src="js/jarvis.js?v=3"></script>
</body>
</html>
