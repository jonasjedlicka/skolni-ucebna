<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: stránka sahá až k okrajům iPhonu (kvůli liště dole) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <!-- Aplikace na ploše (PWA): manifest, ikona a celá obrazovka bez lišty prohlížeče -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/ikony/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/ikony/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <!-- black-translucent: obsah sahá až pod hodiny a baterii (okraj řeší env(safe-area-inset-top) v CSS) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Přehled · Dashboard</title>
  <link rel="stylesheet" href="css/style.css?v=20">
</head>
<!-- data-zalozka říká, která záložka v navigaci je aktivní -->
<body data-zalozka="prehled">
  <header class="hlavicka">
    <div class="hlavicka-obsah">
      <a class="logo" href="index.html">Dashboard</a>
      <!-- Záložky vykreslí js/spolecne.js ze seznamu v js/zalozky.js -->
      <nav class="navigace" id="navigace" aria-label="Záložky"></nav>
    </div>
  </header>

  <!-- Přehled: to nejdůležitější na dnešek ze všech oblastí.
       Dlaždice vloží js/index.js podle modulů v js/moduly/. -->
  <main>
    <div class="hlavicka-stranky">
      <h1>Dnes</h1>
      <div class="dnes-radek">
        <p class="podnadpis" id="dnes-datum"></p>
        <!-- Tlačítko „Aktualizovat vše“ vloží js/index.js (logika v js/obnova.js) -->
        <div id="obnovit-vse"></div>
      </div>
    </div>
    <div class="prehled-mrizka" id="dnes">
      <p class="nacitani">Načítá se…</p>
    </div>
  </main>

  <footer class="paticka">Data: Edookit, e-jidelnicek.cz, Google Kalendář, Open-Meteo, RSS, Yahoo Finance, ČNB · <button type="button" class="odkaz-tlacitko" id="odhlasit">Odhlásit</button></footer>

  <!-- Pořadí je důležité: záložky, společné funkce, moduly, nakonec Přehled.
       Nový modul = nový soubor v js/moduly/ a jeden řádek tady.
       ?v=20 je číslo verze: po větší změně ho zvyš na všech stránkách, ať
       prohlížeče nenačítají staré soubory ze své mezipaměti. -->
  <script src="js/zalozky.js?v=20"></script>
  <script src="js/spolecne.js?v=20"></script>
  <script src="js/zapisy.js?v=20"></script>
  <script src="js/obnova.js?v=20"></script>
  <script src="js/moduly/pocasi.js?v=20"></script>
  <script src="js/moduly/skola.js?v=20"></script>
  <script src="js/moduly/obedy.js?v=20"></script>
  <script src="js/moduly/ukoly.js?v=20"></script>
  <script src="js/moduly/doucovani.js?v=20"></script>
  <script src="js/moduly/znamky.js?v=20"></script>
  <script src="js/moduly/odpocty.js?v=20"></script>
  <script src="js/moduly/navyky.js?v=20"></script>
  <script src="js/moduly/trenink.js?v=20"></script>
  <script src="js/moduly/kalendar.js?v=20"></script>
  <script src="js/moduly/soustredeni.js?v=20"></script>
  <script src="js/moduly/poznamky.js?v=20"></script>
  <script src="js/moduly/cile.js?v=20"></script>
  <script src="js/moduly/akcie.js?v=20"></script>
  <script src="js/moduly/zpravy.js?v=20"></script>
  <script src="js/index.js?v=20"></script>
</body>
</html>
