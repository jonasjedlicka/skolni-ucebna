<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: stránka sahá až k okrajům iPhonu (kvůli liště dole) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Přehled · Dashboard</title>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<!-- data-zalozka říká, která záložka v navigaci je aktivní -->
<body data-zalozka="prehled">
  <header class="hlavicka">
    <div class="hlavicka-obsah">
      <a class="logo" href="index.html">Dashboard</a>
      <!-- Záložky vykreslí js/spolecne.js ze seznamu v js/zalozky.js -->
      <nav class="navigace" id="navigace" aria-label="Záložky"></nav>
    </div>
  </header>

  <!-- Přehled: to nejdůležitější na dnešek ze všech oblastí.
       Dlaždice vloží js/index.js podle modulů v js/moduly/. -->
  <main>
    <div class="hlavicka-stranky">
      <h1>Dnes</h1>
      <p class="podnadpis" id="dnes-datum"></p>
    </div>
    <div class="prehled-mrizka" id="dnes">
      <p class="nacitani">Načítá se…</p>
    </div>
  </main>

  <footer class="paticka">Data: Edookit, Google Kalendář, Open-Meteo, RSS, Yahoo Finance, ČNB · <button type="button" class="odkaz-tlacitko" id="zamknout">Zamknout</button></footer>

  <!-- Pořadí je důležité: záložky, společné funkce, moduly, nakonec Přehled.
       Nový modul = nový soubor v js/moduly/ a jeden řádek tady.
       ?v=6 je číslo verze: po větší změně ho zvyš na všech stránkách, ať
       prohlížeče nenačítají staré soubory ze své mezipaměti. -->
  <script src="js/zalozky.js?v=6"></script>
  <script src="js/spolecne.js?v=6"></script>
  <script src="js/moduly/pocasi.js?v=6"></script>
  <script src="js/moduly/skola.js?v=6"></script>
  <script src="js/moduly/kalendar.js?v=6"></script>
  <script src="js/moduly/soustredeni.js?v=6"></script>
  <script src="js/moduly/akcie.js?v=6"></script>
  <script src="js/moduly/zpravy.js?v=6"></script>
  <script src="js/index.js?v=6"></script>
</body>
</html>
