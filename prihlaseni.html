<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Přihlášení · Dashboard</title>
  <link rel="stylesheet" href="css/style.css?v=17">
</head>
<body class="prihlaseni-stranka">
  <!-- Druhá pojistka vedle Tailscale: bez hesla server nepošle žádná data.
       Přihlášení vydrží na tomhle zařízení 30 dní. -->
  <main>
    <form class="sklo prihlaseni" id="prihlaseni">
      <h1>Dashboard</h1>
      <p class="slaby">Zadej heslo nebo PIN.</p>
      <input type="password" name="heslo" autocomplete="current-password" required autofocus aria-label="Heslo">
      <p class="chyba" id="chyba" role="alert"></p>
      <button type="submit" class="hlavni-tlacitko">Přihlásit</button>
    </form>
  </main>
  <script src="js/prihlaseni.js?v=17"></script>
</body>
</html>
