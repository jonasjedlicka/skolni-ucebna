<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <!-- Aplikace na ploše (PWA): manifest, ikona a celá obrazovka bez lišty prohlížeče -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/ikony/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/ikony/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <!-- black-translucent: obsah sahá až pod hodiny a baterii (okraj řeší env(safe-area-inset-top) v CSS) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Přihlášení · Dashboard</title>
  <link rel="stylesheet" href="css/style.css?v=21">
</head>
<body class="prihlaseni-stranka">
  <!-- Pojistka, kdyby k Macu sedl někdo jiný: bez hesla server nepošle žádná data.
       Přihlášení vydrží na tomhle zařízení 30 dní. -->
  <main>
    <form class="sklo prihlaseni" id="prihlaseni">
      <h1>Dashboard</h1>
      <p class="slaby">Zadej heslo nebo PIN.</p>
      <input type="password" name="heslo" autocomplete="current-password" required autofocus aria-label="Heslo">
      <p class="chyba" id="chyba" role="alert"></p>
      <button type="submit" class="hlavni-tlacitko">Přihlásit</button>
    </form>
  </main>
  <script src="js/prihlaseni.js?v=21"></script>
</body>
</html>
